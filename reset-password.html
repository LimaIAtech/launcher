<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lima IA tech · Nova senha</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 0 84 72'%3E%3Cdefs%3E%3ClinearGradient id='v1' x1='4' y1='4' x2='68' y2='68' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%235AAAE8'/%3E%3Cstop offset='100%25' stop-color='%2300C4FF'/%3E%3C/linearGradient%3E%3ClinearGradient id='v2' x1='4' y1='68' x2='68' y2='4' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%2300C4FF' stop-opacity='0.45'/%3E%3Cstop offset='100%25' stop-color='%235AAAE8' stop-opacity='0.15'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='-4' y='0' width='84' height='72' rx='16' fill='%230a1628'/%3E%3Cpath d='M 36,4 C 36,4 42,4 52,14 C 62,24 68,36 68,36 C 68,36 68,42 58,52 C 48,62 36,68 36,68 C 36,68 30,68 20,58 C 10,48 4,36 4,36 C 4,36 4,30 14,20 C 24,10 36,4 36,4 Z' stroke='url(%23v1)' stroke-width='3' fill='none'/%3E%3Cpath d='M 20,36 L 36,36' stroke='url(%23v1)' stroke-width='3.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M 36,36 L 36,20' stroke='url(%23v1)' stroke-width='3.6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M 36,36 L 73,36' stroke='url(%23v1)' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M 36,36 L 36,52' stroke='url(%23v2)' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='36' r='3.6' fill='%235AAAE8' opacity='0.75'/%3E%3Ccircle cx='36' cy='36' r='6.5' fill='%230F1E3C'/%3E%3Ccircle cx='36' cy='36' r='6.5' stroke='url(%23v1)' stroke-width='2.2' fill='none'/%3E%3Ccircle cx='36' cy='36' r='2.6' fill='%2300C4FF'/%3E%3Ccircle cx='73' cy='36' r='4.8' fill='%2300C4FF'/%3E%3Ccircle cx='36' cy='20' r='3.4' fill='%235AAAE8' opacity='0.7'/%3E%3Ccircle cx='36' cy='52' r='2.6' fill='%235AAAE8' opacity='0.3'/%3E%3C/svg%3E"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #0a1628; --surface: #111e38; --cyan: #00C4FF; --blue: #5AAAE8; --light: #EBF2FB; --muted: #6b8db5; --border: rgba(90,170,232,0.2); --error: #f87171; }
  body { background: var(--bg); font-family: 'Nunito', sans-serif; color: var(--light); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 1.5rem; }
  .logo { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .logo p { font-size: 11px; color: var(--blue); font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
  h1 { font-size: 18px; font-weight: 800; color: var(--light); text-align: center; }
  label { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; display: block; margin-bottom: 6px; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 14px; font-family: 'Nunito', sans-serif; color: var(--light); outline: none; transition: border-color 0.2s; }
  input:focus { border-color: var(--cyan); }
  .field-wrap { position: relative; }
  .field-wrap input { padding-right: 42px; }
  .toggle-eye { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: none; padding: 4px; cursor: pointer; color: var(--muted); display: flex; }
  .toggle-eye:hover { color: var(--light); }
  .toggle-eye svg { display: block; }
  .toggle-eye .icon-on { display: none; }
  .toggle-eye.visible .icon-off { display: none; }
  .toggle-eye.visible .icon-on { display: block; }
  .error-msg { font-size: 12px; color: var(--error); background: rgba(248,113,113,0.1); border-radius: 8px; padding: 10px 12px; display: none; }
  .error-msg.show { display: block; }
  .success { font-size: 13px; color: #4ade80; background: rgba(74,222,128,0.1); border-radius: 10px; padding: 14px; text-align: center; display: none; }
  .success.show { display: block; }
  button[type=submit] { width: 100%; background: var(--cyan); color: #0a1628; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 800; font-family: 'Nunito', sans-serif; cursor: pointer; transition: opacity 0.2s; }
  button[type=submit]:hover { opacity: 0.88; }
  button[type=submit]:disabled { opacity: 0.5; cursor: not-allowed; }
  .fields { display: flex; flex-direction: column; gap: 1rem; }
  .back { text-align: center; font-size: 13px; }
  .back a { color: var(--blue); text-decoration: none; font-weight: 600; }
  .back a:hover { color: var(--cyan); }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="-4 0 215 72" width="200" height="32" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="v1" x1="4" y1="4" x2="68" y2="68" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#5AAAE8"/><stop offset="100%" stop-color="#00C4FF"/></linearGradient><linearGradient id="v2" x1="4" y1="68" x2="68" y2="4" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00C4FF" stop-opacity="0.45"/><stop offset="100%" stop-color="#5AAAE8" stop-opacity="0.15"/></linearGradient></defs><path d="M 36,4 C 36,4 42,4 52,14 C 62,24 68,36 68,36 C 68,36 68,42 58,52 C 48,62 36,68 36,68 C 36,68 30,68 20,58 C 10,48 4,36 4,36 C 4,36 4,30 14,20 C 24,10 36,4 36,4 Z" stroke="url(#v1)" stroke-width="2.2" fill="none"/><path d="M 20,36 L 36,36" stroke="url(#v1)" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M 36,36 L 36,20" stroke="url(#v1)" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M 36,36 L 73,36" stroke="url(#v1)" stroke-width="3.2" fill="none" stroke-linecap="round"/><path d="M 36,36 L 36,52" stroke="url(#v2)" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="20" cy="36" r="3" fill="#5AAAE8" opacity="0.75"/><circle cx="36" cy="36" r="5.5" fill="#0F1E3C"/><circle cx="36" cy="36" r="5.5" stroke="url(#v1)" stroke-width="1.8" fill="none"/><circle cx="36" cy="36" r="2.2" fill="#00C4FF"/><circle cx="73" cy="36" r="4" fill="#00C4FF"/><circle cx="73" cy="36" r="7" fill="#00C4FF" opacity="0.11"/><circle cx="36" cy="20" r="2.8" fill="#5AAAE8" opacity="0.7"/><circle cx="36" cy="52" r="2.2" fill="#5AAAE8" opacity="0.3"/><text x="84" y="44" font-family="'Nunito',Arial,sans-serif" font-size="30" font-weight="800"><tspan fill="#FFF">Lima</tspan><tspan fill="#00C4FF" font-weight="900">IA</tspan></text></svg>
    <p>Painel de Ferramentas</p>
  </div>

  <h1>Nova senha</h1>

  <div id="errMsg" class="error-msg"></div>
  <div id="success" class="success">Senha redefinida com sucesso! Redirecionando…</div>

  <form id="form" onsubmit="handleReset(event)">
    <div class="fields">
      <div>
        <label for="pwd">Nova senha</label>
        <div class="field-wrap">
          <input id="pwd" type="password" placeholder="••••••••" required minlength="6"/>
          <button type="button" class="toggle-eye" onclick="togglePwd('pwd', this)" aria-label="Mostrar senha" tabindex="-1">
            <svg class="icon-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
      </div>
      <div>
        <label for="pwd2">Confirmar nova senha</label>
        <div class="field-wrap">
          <input id="pwd2" type="password" placeholder="••••••••" required minlength="6"/>
          <button type="button" class="toggle-eye" onclick="togglePwd('pwd2', this)" aria-label="Mostrar senha" tabindex="-1">
            <svg class="icon-on" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="icon-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
          </button>
        </div>
      </div>
    </div>
    <button type="submit" id="btn" style="margin-top:1.25rem">Redefinir senha</button>
  </form>

  <div class="back"><a href="/login.html">← Voltar para o login</a></div>
</div>

<script>
function togglePwd(inputId, btn) {
  const input = document.getElementById(inputId);
  const visible = input.type === 'text';
  input.type = visible ? 'password' : 'text';
  btn.classList.toggle('visible', !visible);
  btn.setAttribute('aria-label', visible ? 'Mostrar senha' : 'Ocultar senha');
}

const params = new URLSearchParams(window.location.search);
const token  = params.get('token') || '';

if (!token) {
  document.getElementById('errMsg').textContent = 'Link inválido ou expirado. Solicite um novo.';
  document.getElementById('errMsg').classList.add('show');
  document.getElementById('btn').disabled = true;
}

async function handleReset(e) {
  e.preventDefault();
  const btn  = document.getElementById('btn');
  const pwd  = document.getElementById('pwd');
  const pwd2 = document.getElementById('pwd2');
  const err  = document.getElementById('errMsg');
  err.classList.remove('show');

  if (pwd.value !== pwd2.value) {
    err.textContent = 'As senhas não coincidem.';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Salvando…';

  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: pwd.value }),
    });
    if (res.ok) {
      document.getElementById('form').style.display = 'none';
      document.getElementById('success').classList.add('show');
      setTimeout(() => window.location.href = '/login.html', 2000);
    } else {
      const data = await res.json();
      err.textContent = data.error === 'expired'
        ? 'Link expirado. Solicite um novo link de recuperação.'
        : 'Link inválido. Solicite um novo link de recuperação.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Redefinir senha';
    }
  } catch {
    err.textContent = 'Erro de conexão. Tente novamente.';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Redefinir senha';
  }
}
</script>
</body>
</html>
